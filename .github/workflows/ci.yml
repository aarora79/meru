# CI: format, vet, lint, module hygiene, tests with coverage on Linux and
# macOS, a cross-compile for every release platform, the desktop app on macOS
# and Linux, and the end-to-end tests. docs/ci.md explains each check and how to run it
# locally; most steps call a Makefile target so local runs and CI stay the same.

name: ci

on:
  push:
  pull_request:

# Read-only by default. No job here writes to the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format, vet, staticcheck, modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: go mod verify and tidy
        run: make tidy-check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race with coverage
        run: make cover
      - name: coverage summary
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')"
          {
            echo "### Coverage on ${{ matrix.os }}"
            echo
            echo "Total statement coverage: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build ./cmd/...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "bin/${GOOS}-${GOARCH}/" ./cmd/...

  # The desktop app uses Wails v3, which needs cgo and the system WebView,
  # so it builds on the machine that runs it, and only on macOS for now.
  # Windows (WebView2) gets a job of its own later.
  desktop:
    name: desktop app (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make desktop
        run: make desktop
      - name: make installer
        run: make installer
      - name: vet, staticcheck and govulncheck with the desktop tags
        run: make desktop-check

  # The same app on Linux, against GTK 4 and WebKitGTK 6.0, which the pinned
  # Wails needs and Ubuntu 24.04 has. make desktop-linux also packs the
  # archive the desktop-linux workflow adds to a release.
  desktop-linux:
    name: desktop app (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - name: make desktop-linux
        run: make desktop-linux
      - name: vet, staticcheck and govulncheck with the desktop tags
        run: make desktop-check

  e2e:
    name: end-to-end
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds merud, meru and fakeollama, then runs them as separate processes.
      - name: go test -tags e2e ./test/e2e/...
        run: make e2e

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: actionlint
        run: make actionlint
