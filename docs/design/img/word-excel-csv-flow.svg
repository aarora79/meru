<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Meru reads Word, Excel and CSV files</title>
  <desc id="d">A .docx, .xlsx or .csv file in an [index] folder or the output folder goes to the readers in internal/index. Word and Excel files are ZIP archives, so a capped ZIP reader opens them first and hands the parts to the Word and Excel readers; a CSV file goes to the CSV reader. The readers produce text and tables for three users: the indexer, which writes chunks into meru.db for search; read_file and grep; and the new analyze_table tool. Every tool call goes through dispatch, which logs it to tool_calls and the transcript.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- files -->
  <text x="30" y="40" font-size="13" font-weight="700" fill="#5f6368" letter-spacing="1">YOUR FILES</text>
  <rect x="30" y="60" width="150" height="54" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="105" y="84" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">contract.docx</text>
  <text x="105" y="103" font-size="12" text-anchor="middle" fill="#5f6368">Word</text>
  <rect x="30" y="134" width="150" height="54" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="105" y="158" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">budget.xlsx</text>
  <text x="105" y="177" font-size="12" text-anchor="middle" fill="#5f6368">Excel</text>
  <rect x="30" y="208" width="150" height="54" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="105" y="232" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">trip-expenses.csv</text>
  <text x="105" y="251" font-size="12" text-anchor="middle" fill="#5f6368">CSV</text>

  <!-- readers -->
  <rect x="230" y="30" width="330" height="262" rx="14" fill="#e6f4f1" stroke="#0e7c7b" stroke-width="1.5"/>
  <text x="250" y="54" font-size="13" font-weight="700" fill="#0a5453" letter-spacing="1">READERS · internal/index</text>
  <rect x="250" y="70" width="140" height="64" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="320" y="95" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">ZIP parts</text>
  <text x="320" y="113" font-size="11.5" text-anchor="middle" fill="#5f6368">capped, in memory,</text>
  <text x="320" y="127" font-size="11.5" text-anchor="middle" fill="#5f6368">never written to disk</text>
  <rect x="410" y="70" width="130" height="46" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="475" y="91" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">docx.go</text>
  <text x="475" y="107" font-size="11.5" text-anchor="middle" fill="#5f6368">headings, tables</text>
  <rect x="410" y="128" width="130" height="46" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="475" y="149" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">xlsx.go</text>
  <text x="475" y="165" font-size="11.5" text-anchor="middle" fill="#5f6368">sheets, dates</text>
  <rect x="410" y="214" width="130" height="46" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="475" y="235" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">csv.go</text>
  <text x="475" y="251" font-size="11.5" text-anchor="middle" fill="#5f6368">comma or semicolon</text>
  <path d="M180 87 L246 98" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M180 161 L246 116" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M180 235 L406 237" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M390 94 L406 93" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M390 112 L406 145" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="250" y="200" font-size="12" fill="#3c4043">Text for every file;</text>
  <text x="250" y="216" font-size="12" fill="#3c4043">a Table per sheet</text>
  <text x="250" y="232" font-size="12" fill="#3c4043">for Excel and CSV</text>

  <!-- users -->
  <text x="620" y="40" font-size="13" font-weight="700" fill="#5f6368" letter-spacing="1">WHO USES IT</text>
  <rect x="620" y="56" width="310" height="66" rx="10" fill="#ffffff" stroke="#9aa0a6"/>
  <text x="640" y="80" font-size="14.5" font-weight="600" fill="#202124">The indexer</text>
  <text x="640" y="99" font-size="12" fill="#5f6368">chunks by heading, or by rows with column</text>
  <text x="640" y="114" font-size="12" fill="#5f6368">names, into meru.db for search</text>
  <rect x="620" y="138" width="310" height="66" rx="10" fill="#ffffff" stroke="#9aa0a6"/>
  <text x="640" y="162" font-size="14.5" font-weight="600" fill="#202124">read_file and grep</text>
  <text x="640" y="181" font-size="12" fill="#5f6368">read the text; grep says</text>
  <text x="640" y="196" font-size="12" fill="#5f6368">"sheet Invoices, row 14"</text>
  <rect x="620" y="220" width="310" height="66" rx="10" fill="#fdf3dc" stroke="#e9a82c" stroke-width="1.5"/>
  <text x="640" y="244" font-size="14.5" font-weight="600" fill="#202124">analyze_table (new)</text>
  <text x="640" y="263" font-size="12" fill="#5f6368">filters, groups, adds up and sorts</text>
  <text x="640" y="278" font-size="12" fill="#5f6368">one sheet, from fixed fields</text>
  <path d="M560 120 L616 92" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M560 165 L616 170" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M560 215 L616 250" stroke="#3c4043" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- dispatch -->
  <rect x="230" y="330" width="700" height="58" rx="12" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="250" y="355" font-size="14.5" font-weight="600" fill="#202124">dispatch</text>
  <text x="250" y="375" font-size="12" fill="#5f6368">every tool call: allowlist, a tool_calls row, transcript lines; analyze_table only reads, so it never asks</text>
  <path d="M912 204 L912 326" stroke="#3c4043" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M860 286 L860 326" stroke="#3c4043" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="30" y="430" font-size="12.5" fill="#5f6368">The model never writes code: it fills in analyze_table's fixed fields, and Meru starts no program.</text>
  <text x="30" y="450" font-size="12.5" fill="#5f6368">Every reader stops at a size, row or column limit with one line that says why.</text>
</svg>
