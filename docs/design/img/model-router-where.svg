<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where each of Meru's models runs</title>
  <desc id="d">On this machine, Ollama is required and runs the fast model, which routes questions, picks skills, writes summaries and answers web pages and easy questions, and the embedding model, which indexes files and pictures and embeds each search. It may also run the main and large answer models. merud's agent loop calls them, and every tool runs locally through dispatch. Off the machine, a near-edge endpoint on the owner's network or a remote hosted endpoint may run an answer model, over the Ollama, OpenAI or Anthropic API, and a turn reaches one only after the user says this time or this chat. Incognito chats and jobs never leave.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b06000"/></marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- this machine -->
  <rect x="20" y="20" width="580" height="390" rx="14" fill="#e6f4f1" stroke="#0e7c7b" stroke-width="1.5"/>
  <text x="40" y="46" font-size="13" font-weight="700" fill="#0a5453" letter-spacing="1">THIS MACHINE</text>

  <!-- agent loop -->
  <rect x="40" y="66" width="200" height="74" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="140" y="94" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">merud agent loop</text>
  <text x="140" y="114" font-size="12" text-anchor="middle" fill="#5f6368">picks the answer model,</text>
  <text x="140" y="130" font-size="12" text-anchor="middle" fill="#5f6368">asks before it leaves</text>

  <rect x="40" y="300" width="200" height="90" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="140" y="328" font-size="15" font-weight="600" text-anchor="middle" fill="#202124">dispatch</text>
  <text x="140" y="348" font-size="12" text-anchor="middle" fill="#5f6368">every tool runs here,</text>
  <text x="140" y="364" font-size="12" text-anchor="middle" fill="#5f6368">whichever model asked</text>
  <text x="140" y="380" font-size="12" text-anchor="middle" fill="#5f6368">for it</text>
  <path d="M140 140 L140 296" stroke="#3c4043" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ollama -->
  <rect x="290" y="66" width="290" height="324" rx="12" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
  <text x="310" y="92" font-size="14" font-weight="700" fill="#202124">Ollama (required)</text>

  <rect x="310" y="108" width="250" height="84" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="325" y="131" font-size="14" font-weight="600" fill="#202124">fast model</text>
  <text x="325" y="150" font-size="12" fill="#5f6368">router, skill pick, summaries,</text>
  <text x="325" y="166" font-size="12" fill="#5f6368">web page answers, and easy</text>
  <text x="325" y="182" font-size="12" fill="#5f6368">questions when routing is on</text>

  <rect x="310" y="204" width="250" height="68" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="325" y="227" font-size="14" font-weight="600" fill="#202124">embedding model</text>
  <text x="325" y="246" font-size="12" fill="#5f6368">indexing, search, picture</text>
  <text x="325" y="262" font-size="12" fill="#5f6368">search</text>

  <rect x="310" y="284" width="250" height="90" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="5 4"/>
  <text x="325" y="307" font-size="14" font-weight="600" fill="#202124">main and large models</text>
  <text x="325" y="326" font-size="12" fill="#5f6368">answer models, when they</text>
  <text x="325" y="342" font-size="12" fill="#5f6368">run here (the default)</text>
  <text x="325" y="362" font-size="12" fill="#0a5453">always here for incognito and jobs</text>

  <path d="M240 103 L286 103" stroke="#3c4043" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- off the machine -->
  <rect x="650" y="20" width="290" height="390" rx="14" fill="#fef7e0" stroke="#e9a82c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="670" y="46" font-size="13" font-weight="700" fill="#b06000" letter-spacing="1">OFF THIS MACHINE</text>
  <text x="670" y="66" font-size="12" fill="#5f6368">answer models only, with your yes</text>

  <rect x="670" y="86" width="250" height="100" rx="10" fill="#ffffff" stroke="#e9a82c"/>
  <text x="685" y="110" font-size="14" font-weight="600" fill="#202124">near-edge endpoint</text>
  <text x="685" y="130" font-size="12" fill="#5f6368">a machine on your network or</text>
  <text x="685" y="146" font-size="12" fill="#5f6368">your private cloud network;</text>
  <text x="685" y="162" font-size="12" fill="#5f6368">private addresses only</text>

  <rect x="670" y="204" width="250" height="100" rx="10" fill="#ffffff" stroke="#e9a82c"/>
  <text x="685" y="228" font-size="14" font-weight="600" fill="#202124">remote endpoint</text>
  <text x="685" y="248" font-size="12" fill="#5f6368">a hosted model you have a</text>
  <text x="685" y="264" font-size="12" fill="#5f6368">key for; https only</text>
  <text x="685" y="280" font-size="12" fill="#5f6368">key in secrets.toml</text>

  <text x="670" y="334" font-size="12" font-weight="600" fill="#202124">Speaks one of:</text>
  <text x="670" y="354" font-size="12" fill="#5f6368">Ollama's API, OpenAI chat</text>
  <text x="670" y="370" font-size="12" fill="#5f6368">completions, or Anthropic</text>
  <text x="670" y="386" font-size="12" fill="#5f6368">Messages</text>

  <path d="M240 88 C 400 0, 560 0, 646 100" stroke="#b06000" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <rect x="400" y="8" width="170" height="22" rx="11" fill="#ffffff" stroke="#e9a82c"/>
  <text x="485" y="23" font-size="11.5" text-anchor="middle" fill="#b06000">ask first: this time / this chat</text>
</svg>
