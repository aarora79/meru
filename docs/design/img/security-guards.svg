<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where Meru's guards sit</title>
  <desc id="d">On the left, your clients, Meru.app, meru chat and meru, reach merud only through merud.sock, which answers processes of your own account alone. Inside merud, the agent loop asks the model for tool calls, and every call goes through dispatch: the allow list first, then the approval, which asks every time once the chat has read outside content, then the record in tool_calls and the transcript. On the right, the tools: your files, read only; the meru-output folder, the one place Meru writes; mail, calendar and Drive through MCP servers; and the web through web_fetch's address check. Text from mail, servers and the web comes back into the chat as outside content, marked by a dashed orange line, and an approval question goes back to you.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c5541b"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- your account boundary -->
  <rect x="12" y="14" width="936" height="472" rx="14" fill="none" stroke="#9aa0a6" stroke-dasharray="6 5"/>
  <text x="28" y="36" font-size="12" font-weight="700" fill="#5f6368">Your Mac, your account</text>

  <!-- clients -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="34" y="70" width="150" height="44" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="109" y="97" font-weight="600" fill="#202124">Meru.app</text>
    <rect x="34" y="126" width="150" height="44" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="109" y="153" font-weight="600" fill="#202124">meru chat</text>
    <rect x="34" y="182" width="150" height="44" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="109" y="209" font-weight="600" fill="#202124">meru, scripts</text>
  </g>
  <text x="109" y="252" font-size="11.5" text-anchor="middle" fill="#5f6368">you ask, and you answer</text>
  <text x="109" y="268" font-size="11.5" text-anchor="middle" fill="#5f6368">each approval</text>

  <!-- socket -->
  <rect x="214" y="104" width="112" height="96" rx="10" fill="#fef7e0" stroke="#e9a82c"/>
  <g font-size="12" text-anchor="middle">
    <text x="270" y="128" font-weight="700" fill="#202124">1 merud.sock</text>
    <text x="270" y="148" font-size="11.5" fill="#5f6368">yours only:</text>
    <text x="270" y="164" font-size="11.5" fill="#5f6368">mode 0600 and</text>
    <text x="270" y="180" font-size="11.5" fill="#5f6368">your user ID</text>
  </g>
  <path d="M184 148 L210 148" stroke="#3c4043" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- merud -->
  <rect x="352" y="56" width="330" height="410" rx="12" fill="#e6f4f1" stroke="#0e7c7b"/>
  <text x="368" y="80" font-size="13.5" font-weight="700" fill="#202124">merud</text>
  <path d="M326 152 L348 152" stroke="#3c4043" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="372" y="94" width="290" height="62" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="517" y="118" font-size="13.5" font-weight="600" text-anchor="middle" fill="#202124">Agent loop and the model</text>
  <text x="517" y="138" font-size="11.5" text-anchor="middle" fill="#5f6368">knows whether this chat read outside content</text>

  <rect x="372" y="178" width="290" height="270" rx="10" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="517" y="200" font-size="13.5" font-weight="600" text-anchor="middle" fill="#202124">dispatch: every tool call</text>
  <path d="M517 156 L517 174" stroke="#3c4043" stroke-width="1.6" marker-end="url(#a)"/>

  <g font-size="12">
    <rect x="390" y="214" width="254" height="50" rx="8" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="402" y="234" font-weight="700" fill="#202124">2 Allow list</text>
    <text x="402" y="252" font-size="11.5" fill="#5f6368">a tool not named in config never runs</text>

    <rect x="390" y="276" width="254" height="84" rx="8" fill="#fef7e0" stroke="#e9a82c"/>
    <text x="402" y="296" font-weight="700" fill="#202124">3 Approval</text>
    <text x="402" y="314" font-size="11.5" fill="#5f6368">send, change, create: asks you first</text>
    <text x="402" y="330" font-size="11.5" fill="#5f6368">after outside content: asks every time</text>
    <text x="402" y="346" font-size="11.5" fill="#5f6368">remember: asks after outside content</text>

    <rect x="390" y="372" width="254" height="62" rx="8" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="402" y="392" font-weight="700" fill="#202124">4 Record</text>
    <text x="402" y="410" font-size="11.5" fill="#5f6368">tool_calls and the transcript, for every</text>
    <text x="402" y="426" font-size="11.5" fill="#5f6368">call, the refused ones too</text>
  </g>
  <path d="M517 264 L517 272" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M517 360 L517 368" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- approval back to you -->
  <path d="M390 318 C 300 318, 230 300, 186 236" stroke="#e9a82c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="250" y="330" font-size="11.5" fill="#8a5a00">"Send this?"</text>

  <!-- tools -->
  <g font-size="13" text-anchor="middle">
    <rect x="712" y="70" width="216" height="60" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="820" y="94" font-weight="600" fill="#202124">Your files</text>
    <text x="820" y="114" font-size="11.5" fill="#5f6368">read only</text>

    <rect x="712" y="146" width="216" height="76" rx="10" fill="#f8f9fa" stroke="#9aa0a6"/>
    <text x="820" y="170" font-weight="600" fill="#202124">~/meru-output</text>
    <text x="820" y="190" font-size="11.5" fill="#5f6368">the one folder Meru writes;</text>
    <text x="820" y="206" font-size="11.5" fill="#5f6368">no tool deletes a file</text>

    <rect x="712" y="238" width="216" height="76" rx="10" fill="#fdeee6" stroke="#c5541b"/>
    <text x="820" y="262" font-weight="600" fill="#202124">Mail, calendar, Drive</text>
    <text x="820" y="282" font-size="11.5" fill="#5f6368">MCP servers you added</text>
    <text x="820" y="298" font-size="11.5" fill="#5f6368">and allowed, tool by tool</text>

    <rect x="712" y="330" width="216" height="76" rx="10" fill="#fdeee6" stroke="#c5541b"/>
    <text x="820" y="354" font-weight="600" fill="#202124">The web</text>
    <text x="820" y="374" font-size="11.5" fill="#5f6368">5 web_fetch asks before an</text>
    <text x="820" y="390" font-size="11.5" fill="#5f6368">address nobody gave it</text>
  </g>
  <path d="M662 250 L708 104" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M662 272 L708 186" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M662 300 L708 276" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M662 322 L708 366" stroke="#3c4043" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- outside content comes back -->
  <path d="M712 290 C 690 200, 690 140, 666 128" stroke="#c5541b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#o)"/>
  <path d="M712 378 C 696 300, 700 160, 666 134" stroke="#c5541b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#o)"/>
  <text x="712" y="440" font-size="11.5" fill="#c5541b">orange: other people's words come back</text>
  <text x="712" y="456" font-size="11.5" fill="#c5541b">as outside content and mark the chat</text>
</svg>
