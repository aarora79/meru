# Meru config: an example with every key and its default.
#
# merud reads ~/.meru/config.toml at startup (or the file named by -config).
# Without a file, merud uses the defaults shown here. Meru never writes this
# file itself. Copy what you want to change into ~/.meru/config.toml; any key
# you leave out keeps its default. merud refuses to start on an unknown key or
# a bad value, and names the key.
#
# The directory that holds the config file is Meru's home: sessions/,
# merud.sock and merud.log live next to it.

# Which models fill the three tiers (see ARCHITECTURE.md, "Model tiers").
#   "lite" (default): MiniCPM5-2B for fast and main, nomic-embed-text for embed.
#                     Needs about 16 GB of RAM.
#   "full":           MiniCPM5-2B for fast, qwen3.8:27b for main,
#                     qwen3-embedding:0.6b for embed. Needs 32 GB or more.
profile = "lite"

[models]
# Set a tier here to override the profile's model for it. Empty means "use
# the profile". Names are Ollama model names, as `ollama list` shows them.
fast  = ""   # routing and quick answers
main  = ""   # writes the answer
embed = ""   # embeddings (used from v0.2)

[ollama]
# Where Ollama listens. Loopback only: 127.0.0.1, ::1 or localhost.
base_url   = "http://127.0.0.1:11434"
# How long Ollama keeps a model in memory after a call. "-1" means for as
# long as Ollama runs, which keeps answers fast. Also accepts seconds ("300")
# or a duration ("30m").
keep_alive = "-1"

[agent]
# Most model calls in one turn. v0.1 makes one; tools (v0.3) make more.
max_rounds    = 8
# How many earlier question-and-answer pairs from the session go into the
# prompt. 0 sends none.
history_turns = 10
# The persona and rules sent at the start of every turn. Empty means the
# built-in default.
system_prompt = ""
# How long a session must go without a question before merud writes its
# one- or two-sentence summary, which search can later find.
summary_idle  = "30m"

[router]
# The one-token route classifier. See docs/fast-router.md.
top_logprobs   = 20              # alternatives to read, 1 to 20 (Ollama's cap)
temperature    = 1.25            # above 0; 1.0 means raw. Fitted by `make router-eval`
min_confidence = 0.45            # 0 to 1; below it, take the fallback route
fallback       = "search+tools"  # "direct", "search", "tools" or "search+tools"

[observability]
# OpenTelemetry export over OTLP/HTTP. Empty endpoint (the default) turns
# export off. A non-loopback endpoint is refused; nothing leaves this machine.
otlp_endpoint    = ""            # for example "http://127.0.0.1:4318"
metrics_interval = "10s"         # how often metrics are sent
traces           = true          # send traces too, when an endpoint is set
capture_content  = false         # put prompt and answer text into spans

[log]
# How much merud writes to merud.log, next to this file. "info" writes one
# line per turn plus startup and shutdown. "debug" adds a line for each stage
# of a turn (session, route, prompt, each Ollama call), tagged with the turn's
# trace ID. Neither level writes question or answer text unless
# capture_content is on. Also "warn" or "error". `merud -v` forces "debug".
level = "info"

[index]
# Folders merud reads into its search index. Empty (the default) indexes
# nothing; merud never indexes your whole home directory unless you list "~".
# Each entry is an absolute path or starts with "~/", for example
# folders = ["~/notes", "~/Documents/papers"]
# Restart merud after changing this list. `meru index` rescans the folders
# now, `meru index <folder>` rescans one of them, and `meru index -status`
# shows what the index holds.
folders = []
# Extra .gitignore-style patterns to skip in every folder, on top of the
# built-in list: hidden files and folders, node_modules, .venv, vendor,
# build output, binaries, media, archives and secret files such as .env,
# *.pem and id_rsa. A .gitignore or .meruignore in any indexed folder adds
# rules too. For example ignore = ["*.log", "drafts/"]
ignore = []
# Skip files larger than this many megabytes.
max_file_mb = 5
# Target size of one chunk of text, in tokens. Meru estimates a token as
# four characters.
chunk_tokens = 500
# How much of the previous chunk each chunk repeats, in tokens, so a sentence
# cut at a boundary still appears whole in one chunk. At most half of
# chunk_tokens.
overlap_tokens = 50
# Re-index a file as soon as it changes while merud runs. merud also rescans
# every folder when it starts, so changes made while it was stopped get in.
watch = true

# MCP servers (v0.3): programs that give the model tools. None by default.
# `meru mcp add <name>` writes an entry for you, and `meru mcp list`
# lists the servers it knows. See ARCHITECTURE.md, "MCP".
#
# Each [[mcp.servers]] entry has either command (merud starts the server
# and talks to it over stdin and stdout) or url (a Streamable HTTP server
# that already runs). Tools are deny-by-default: the model gets only the
# tools allow names, one by one, with no wildcards. A tool in confirm asks
# you before each call, and must also be in allow. merud reads this list
# when it starts, so restart it after a change; `meru tools` shows what
# each server offers and what the model gets.
#
# A stdio server:
#
# [[mcp.servers]]
# name    = "brave"                  # letters, digits, - and _; tools become "brave.<tool>"
# command = "npx"                    # run as is, with no shell
# args    = ["-y", "@brave/brave-search-mcp-server", "--transport", "stdio"]
# env     = { BRAVE_API_KEY = "secret:brave_api_key" }   # "secret:" values come from secrets.toml
# allow   = ["brave_web_search", "brave_news_search"]
# confirm = []
# timeout = "60s"                    # longest one call may take; the default
#
# A Streamable HTTP server:
#
# [[mcp.servers]]
# name    = "calendar"
# url     = "http://127.0.0.1:8123/mcp"
# headers = { Authorization = "secret:calendar_token" }  # sent on every request
# network = false                    # true lets url point at another machine
# allow   = ["list_events", "create_event"]
# confirm = ["create_event"]         # asks before each call
#
# Secrets: API keys and tokens live in secrets.toml next to this file, one
# name = "value" per line, never in config.toml. merud refuses the file
# unless only you can read it (chmod 600), and hides every value from
# transcripts, logs and traces. `meru mcp add` writes it for you:
#
#   brave_api_key = "..."

# Other agents (v0.3) that Meru may hand a task to over A2A (Agent2Agent).
# None by default. Each allowed skill, named by the ID on the agent's card,
# becomes a tool called "a2a.<name>.<skill>". url must be loopback unless
# network = true. See ARCHITECTURE.md, "Other agents (A2A)".
#
# [[a2a.agents]]
# name    = "research"
# url     = "http://127.0.0.1:9000"  # where merud reads the agent card
# network = false
# headers = { Authorization = "secret:research_token" }
# allow   = ["summarize"]
# confirm = []
# timeout = "60s"

[builtin]
# Built-in tools that ask before each call. configure, which edits this
# file, always asks and offers no approval for the session, whatever this
# list says. write_file asks before it saves a file; take it out to let it
# write without asking. remember saves a memory without asking; add
# "remember" here to approve each call. read_file, list_folder and grep only
# read the [index] folders and run without asking; list them here to approve
# each call.
confirm = ["write_file"]

[skills]
# The one folder the write_file tool may write in. merud creates it on the
# first write.
output_dir = "~/meru-output"
