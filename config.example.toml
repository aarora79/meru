# Meru config: an example with every key and its default.
#
# merud reads ~/.meru/config.toml at startup (or the file named by -config).
# Without a file, merud uses the defaults shown here. Meru never writes this
# file itself. Copy what you want to change into ~/.meru/config.toml; any key
# you leave out keeps its default. merud refuses to start on an unknown key or
# a bad value, and names the key.
#
# The directory that holds the config file is Meru's home: sessions/,
# merud.sock and merud.log live next to it.

# Which models fill the three tiers (see ARCHITECTURE.md, "Model tiers").
#   "lite" (default): MiniCPM5-2B for fast and main, nomic-embed-text for embed.
#                     Needs about 16 GB of RAM.
#   "full":           MiniCPM5-2B for fast, qwen3.8:27b for main,
#                     qwen3-embedding:0.6b for embed. Needs 32 GB or more.
profile = "lite"

[models]
# Set a tier here to override the profile's model for it. Empty means "use
# the profile". Names are Ollama model names, as `ollama list` shows them.
fast  = ""   # routing and quick answers
main  = ""   # writes the answer
embed = ""   # embeddings (used from v0.2)

[ollama]
# Where Ollama listens. Loopback only: 127.0.0.1, ::1 or localhost.
base_url   = "http://127.0.0.1:11434"
# How long Ollama keeps a model in memory after a call. "-1" means for as
# long as Ollama runs, which keeps answers fast. Also accepts seconds ("300")
# or a duration ("30m").
keep_alive = "-1"

[agent]
# Most model calls in one turn. v0.1 makes one; tools (v0.3) make more.
max_rounds    = 8
# How many earlier question-and-answer pairs from the session go into the
# prompt. 0 sends none.
history_turns = 10
# The persona and rules sent at the start of every turn. Empty means the
# built-in default.
system_prompt = ""
# How long a session must go without a question before merud writes its
# one- or two-sentence summary, which search can later find.
summary_idle  = "30m"

[router]
# The one-token route classifier. See docs/fast-router.md.
top_logprobs   = 20              # alternatives to read, 1 to 20 (Ollama's cap)
temperature    = 1.25            # above 0; 1.0 means raw. Fitted by `make router-eval`
min_confidence = 0.45            # 0 to 1; below it, take the fallback route
fallback       = "search+tools"  # "direct", "search", "tools" or "search+tools"

[observability]
# OpenTelemetry export over OTLP/HTTP. Empty endpoint (the default) turns
# export off. A non-loopback endpoint is refused; nothing leaves this machine.
otlp_endpoint    = ""            # for example "http://127.0.0.1:4318"
metrics_interval = "10s"         # how often metrics are sent
traces           = true          # send traces too, when an endpoint is set
capture_content  = false         # put prompt and answer text into spans

[log]
# How much merud writes to merud.log, next to this file. "info" writes one
# line per turn plus startup and shutdown. "debug" adds a line for each stage
# of a turn (session, route, prompt, each Ollama call), tagged with the turn's
# trace ID. Neither level writes question or answer text unless
# capture_content is on. Also "warn" or "error". `merud -v` forces "debug".
level = "info"

[index]
# Folders merud reads into its search index. Empty (the default) indexes
# nothing; merud never indexes your whole home directory unless you list "~".
# Each entry is an absolute path or starts with "~/", for example
# folders = ["~/notes", "~/Documents/papers"]
# Restart merud after changing this list. `meru index` rescans the folders
# now, `meru index <folder>` rescans one of them, and `meru index -status`
# shows what the index holds.
folders = []
# Extra .gitignore-style patterns to skip in every folder, on top of the
# built-in list: hidden files and folders, node_modules, .venv, vendor,
# build output, binaries, media, archives and secret files such as .env,
# *.pem and id_rsa. A .gitignore or .meruignore in any indexed folder adds
# rules too. For example ignore = ["*.log", "drafts/"]
ignore = []
# Skip files larger than this many megabytes.
max_file_mb = 5
# Target size of one chunk of text, in tokens. Meru estimates a token as
# four characters.
chunk_tokens = 500
# How much of the previous chunk each chunk repeats, in tokens, so a sentence
# cut at a boundary still appears whole in one chunk. At most half of
# chunk_tokens.
overlap_tokens = 50
# Re-index a file as soon as it changes while merud runs. merud also rescans
# every folder when it starts, so changes made while it was stopped get in.
watch = true

# MCP servers (v0.3): programs that give the model tools. None by default.
# `meru mcp add <name>` writes an entry for you, `meru mcp list` lists the
# servers it knows, and `meru mcp` shows each one's state. See
# ARCHITECTURE.md, "MCP".
#
# Each [[mcp.servers]] entry has either command (merud starts the server
# and talks to it over stdin and stdout) or url (a Streamable HTTP server
# that you start and run; merud only connects to it). Tools are
# deny-by-default: the model gets only the tools allow names, one by one,
# with no wildcards. A tool in confirm asks you before each call, and must
# also be in allow. merud reads this list when it starts, so restart it
# after a change; `meru tools` shows what each server offers and what the
# model gets.
#
# merud connects to each server once when it starts. A server that isn't
# connected gets one more try at the start of each turn that offers tools,
# and nothing retries in the background.
#
# A stdio server:
#
# [[mcp.servers]]
# name    = "obsidian"               # letters, digits, - and _; tools become "obsidian.<tool>"
# command = "uvx"                    # run as is, with no shell
# args    = ["mcp-obsidian"]
# env     = { OBSIDIAN_API_KEY = "secret:obsidian_api_key", OBSIDIAN_PORT = "27124" }  # stdio only; "secret:" values come from secrets.toml
# allow   = ["obsidian_simple_search", "obsidian_get_file_contents", "obsidian_append_content"]
# confirm = ["obsidian_append_content"]   # asks before each call
# timeout = "60s"                    # longest one call may take; the default
#
# A Streamable HTTP server. env isn't allowed here, because merud doesn't
# start the server; send a key with headers instead.
#
# [[mcp.servers]]
# name    = "google"
# url     = "http://127.0.0.1:8000/mcp"
# headers = { Authorization = "secret:google_token" }  # sent on every request
# remote  = false                    # true lets merud connect to a url on another machine;
#                                    # it says nothing about what the server itself reaches
# allow   = ["search_gmail_messages", "send_gmail_message"]
# confirm = ["send_gmail_message"]   # asks before each call
# always_confirm = []                # asks before every call, with no approval for the session
#
# Secrets: API keys and tokens live in secrets.toml next to this file, one
# name = "value" per line, never in config.toml. merud refuses the file
# unless only you can read it (chmod 600), and hides every value from
# transcripts, logs and traces. `meru mcp add` writes it for you:
#
#   obsidian_api_key = "..."

# Other agents (v0.3) that Meru may hand a task to over A2A (Agent2Agent).
# None by default. Each allowed skill, named by the ID on the agent's card,
# becomes a tool called "a2a.<name>.<skill>". url must be loopback unless
# remote = true, which covers only where merud connects. See
# ARCHITECTURE.md, "Other agents (A2A)".
#
# [[a2a.agents]]
# name    = "research"
# url     = "http://127.0.0.1:9000"  # where merud reads the agent card
# remote  = false
# headers = { Authorization = "secret:research_token" }
# allow   = ["summarize"]
# confirm = []
# timeout = "60s"

# Local commands (v0.3): programs the model may run, declared one by one.
# None by default. See ARCHITECTURE.md, "Local commands".
#
# Each [[commands]] entry becomes one tool, "cmd.<name>". The model picks
# the command and fills in its parameters; it can't add a flag, chain a
# second program or reach a shell. merud runs argv[0] directly, with no
# shell, and refuses a shell or script interpreter (sh, bash, python, node,
# env and the like) as the program. Each {param} placeholder takes one
# value and stays inside its argv element, even with spaces or quotes in
# it; write {{ and }} for a literal brace. A leading "~" means your home
# folder. Parameter types:
#
#   string  any text up to max_len bytes (default 4096); it can't start
#           with "-" when it fills a whole element, so it can't be a flag
#   int     a whole number, within min and max when set
#   enum    one of values
#   path    must exist and, links followed, lie inside under (required);
#           a relative path starts at under
#
# The program gets PATH, HOME, LANG and the names in env_allowlist from
# merud's environment, nothing else. It starts in cwd (default: your home
# folder) and is killed, with every process it started, after timeout
# (default "30s", at most "300s"). merud keeps 1 MiB of each of stdout and
# stderr. confirm = true asks you before each run; a scheduled job can't
# ask, so it skips such a command. merud reads this list when it starts,
# so restart it after a change. `meru tools` shows what each command runs,
# and `meru log` shows the argv of every run.
#
# [[commands]]
# name        = "git-log"
# description = "Recent commits in one of the user's repositories"
# argv        = ["git", "-C", "{repo}", "log", "--oneline", "-n", "20"]
# timeout     = "10s"
#   [commands.params.repo]
#   type  = "path"
#   under = "~/repos"
#
# [[commands]]
# name        = "git-status"
# description = "Files changed but not committed in one of the user's repositories"
# argv        = ["git", "-C", "{repo}", "status", "--short"]
#   [commands.params.repo]
#   type  = "path"
#   under = "~/repos"
#
# [[commands]]
# name        = "search-notes"
# description = "Full-text search across the user's notes"
# argv        = ["rg", "--json", "--", "{pattern}", "~/notes"]
#   [commands.params.pattern]
#   type        = "string"
#   description = "The text or regular expression to find"
#
# [[commands]]
# name        = "disk-free"
# description = "Free space on each mounted disk"
# argv        = ["df", "-h"]

[builtin]
# Built-in tools that ask before each call. configure, which edits this
# file, always asks and offers no approval for the session, whatever this
# list says. write_file asks before it saves a file; take it out to let it
# write without asking. remember saves a memory without asking; add
# "remember" here to approve each call. read_file, list_folder and grep only
# read the [index] folders and run without asking; list them here to approve
# each call. So does web_search; list it to approve each search. web_fetch
# runs without asking only for a URL that a search result or your own
# question gave, and asks for any other URL and before any download,
# whatever this list says; list it to approve every fetch.
confirm = ["write_file"]

[web]
# Web search (v0.3), through SearXNG, a search engine you run on this
# machine. See "Web search" in docs/running.md for the container and the
# JSON setting, and ARCHITECTURE.md, "Web search".
# Where SearXNG answers. Loopback only, because merud connects to it. The
# web_search tool sends your search words there, and SearXNG passes them to
# the search engines it asks. Empty turns web_search off.
searxng_url = "http://127.0.0.1:8888"
# How many results web_search returns when the model doesn't say. 1 to 20.
max_results = 8
# The web_fetch tool fetches a public web page when the model asks, and
# gives the model its text or the fast model's answer to a question about
# it; it can also download a file to <output_dir>/downloads. merud then
# connects to sites off this machine, the one place it does so on its own,
# and those sites see your IP address. It refuses addresses on this machine
# and your local network. It asks you first for a URL that neither a
# web_search result nor your question gave, so the model can't send your
# data out in a URL it made up. false leaves the tool out.
fetch = true

[skills]
# The one folder the write_file tool may write in, and the parent of the
# downloads folder where web_fetch saves files. merud creates it on the
# first write.
output_dir = "~/meru-output"
