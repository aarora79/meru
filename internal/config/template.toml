# Meru config: every key, with its default.
#
# merud reads ~/.meru/config.toml when it starts (or the file named by
# -config). Restart merud after a change: pkill merud; merud &
#
# Uncommented lines hold the defaults, so this file behaves the same as no
# file at all. Change a value to change a setting. Commented blocks are off;
# delete the "# " in front of each line to turn one on. merud refuses to
# start on an unknown key or a bad value, and names the key.
#
# The folder that holds this file is Meru's home: sessions/, skills/,
# memory/, meru.db, merud.sock and merud.log live next to it.
# `meru config template` prints this template again.

# Which models fill the three tiers (see ARCHITECTURE.md, "Model tiers").
#   "lite": MiniCPM5-2B for fast and main, nomic-embed-text for embed.
#           Needs about 16 GB of memory.
#   "full": MiniCPM5-2B for fast, qwen3.8:27b for main,
#           qwen3-embedding:0.6b for embed. Needs 32 GB or more.
profile = "lite"

[models]
# An empty name takes the profile's model. A name here overrides the
# profile for that tier, so leave these empty unless you want your own
# model. The comments show what "lite" gives; `ollama list` shows names.
fast  = ""   # lite: hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M; routes and quick answers
main  = ""   # lite: hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M; writes the answer
embed = ""   # lite: nomic-embed-text; turns text into vectors for search

# Named sets of models to switch between while merud runs: /model <name>
# in meru chat, or meru model use <name>. A switch changes the main model
# and lasts until merud stops; /model save makes it the default above.
# A set names main, and may name fast and embed, which change only once
# the set is saved and merud restarts. A set that changes embed needs
# --rebuild, because merud then re-embeds every file. think = false turns
# the main model's thinking off, so sets compare on equal terms. A model
# Ollama doesn't list only draws a warning when merud starts.
#
# [[models.sets]]
# name  = "qwen-moe"
# main  = "qwen3.6:35b-a3b-mxfp8"
# think = false
#
# [[models.sets]]
# name  = "gemma-moe"
# main  = "gemma4:26b-mxfp8"
# think = false
#
# [[models.sets]]
# name  = "qwen-dense"
# main  = "qwen3.8:27b-mlx"
# think = false

[ollama]
# Where Ollama listens. Loopback only: 127.0.0.1, ::1 or localhost.
base_url   = "http://127.0.0.1:11434"
# How long Ollama keeps a model loaded after a call. "-1" means as long as
# Ollama runs, so answers start fast. Also takes seconds ("300") or "30m".
keep_alive = "-1"

[agent]
# Most model calls in one turn. Each tool call the model makes costs one.
max_rounds    = 8
# Most tokens the main model may write in one call, its hidden thinking
# included. A thinking model with no cap can reason for minutes and never
# answer.
max_output_tokens = 8192
# Longest one turn may run, from question to answer. When it runs out,
# merud stops the model and any tool calls and says it couldn't answer.
# Time spent waiting for you to approve a tool call counts too.
turn_timeout  = "5m"
# How many earlier questions and answers of the session go into the
# prompt. 0 sends none.
history_turns = 10
# The persona and rules sent at the start of every turn. Empty means the
# built-in default.
system_prompt = ""
# How long a session sits idle before merud writes its short summary,
# which search can find later.
summary_idle  = "30m"

[router]
# The one-token route classifier. See docs/fast-router.md before you change
# these; `make router-eval` measures a change.
top_logprobs   = 20              # alternatives to read, 1 to 20 (Ollama's cap)
temperature    = 1.25            # above 0; 1.0 means raw probabilities
min_confidence = 0.45            # 0 to 1; below it, take the fallback route
fallback       = "search+tools"  # "direct", "search", "tools" or "search+tools"
# How the letters become a route. "top" takes the most likely letter and
# uses min_confidence and fallback. "marginal" asks two questions: does the
# turn need a search (search + search+tools at least search_threshold), and
# does it need tools (tools + search+tools at least tools_threshold)? The
# route offers what each yes adds, and needs no fallback.
decision         = "top"         # "top" or "marginal"
search_threshold = 0.30          # 0 to 1; "marginal" only
tools_threshold  = 0.25          # 0 to 1; "marginal" only

[index]
# Folders merud reads into its search index. Empty indexes nothing; merud
# never indexes your whole home folder unless you list "~". Each entry is
# an absolute path or starts with "~/". For example:
#   folders = ["~/notes", "~/Documents/papers"]
# `meru index` rescans now; `meru index -status` shows what the index holds.
folders = []
# Extra .gitignore-style patterns to skip, on top of the built-in list
# (hidden files, node_modules, build output, binaries, media, archives and
# secrets such as .env and *.pem). For example: ignore = ["*.log", "drafts/"]
ignore = []
# Skip files larger than this many megabytes, 1 to 1024.
max_file_mb = 5
# Target size of one chunk of text, in tokens (about four characters each).
chunk_tokens = 500
# How many tokens each chunk repeats from the one before it, so a sentence
# cut at a boundary stays whole in one chunk. At most half of chunk_tokens.
overlap_tokens = 50
# Re-index a file as soon as it changes. merud also rescans every folder
# when it starts, so edits made while it was stopped get in.
watch = true
# How a question finds text in these folders:
#   "auto"     merud searches before the model answers, on every route but
#              direct, and puts the ten best excerpts in the prompt. The
#              model may also search again with search_files, grep and
#              read_file.
#   "agentic"  no search up front and no earlier conversations: the model
#              explores with search_files, grep, list_folder and read_file.
#              Needs search_files in [builtin] tools.
retrieval = "auto"

[log]
# How much merud writes to merud.log: "debug", "info", "warn" or "error".
# "info" writes the route and a line per turn; "debug" adds one per stage. `merud -v`
# forces "debug". Question and answer text stays out at every level.
level = "info"

[observability]
# OpenTelemetry export over OTLP/HTTP. Empty turns export off. merud
# refuses an endpoint off this machine. To send to the local Grafana stack
# in deploy/, use:
#   otlp_endpoint = "http://127.0.0.1:4318"
otlp_endpoint    = ""
metrics_interval = "10s"   # how often merud sends metrics
traces           = true    # send traces too, when an endpoint is set
capture_content  = false   # put question and answer text into spans

[builtin]
# The tools built into merud. Take a name out to turn that tool off: the
# model never sees it, and `meru tools` doesn't list it.
#   configure     adds an MCP server to this file when you ask in chat
#   datetime      reads the clock and the calendar
#   about_meru    tells the model which models, folders and tools this
#                 setup has, so it doesn't guess from its training
#   remember      saves a fact about you under memory/
#   write_file    saves a file in [skills] output_dir
#   read_file, list_folder, grep
#                 read the [index] folders; off while folders is empty
#   search_files  searches the [index] folders by meaning and by words
#   web_search    searches through SearXNG at [web] searxng_url
#   web_fetch     fetches a public web page when the model asks. merud then
#                 connects to sites off this machine, and they see your IP
#                 address. It asks you first for a URL no search result or
#                 question of yours gave, and before any download.
tools = ["configure", "datetime", "about_meru", "remember", "write_file", "read_file", "list_folder", "grep", "search_files", "web_search", "web_fetch"]
# Tools that ask before each call; each must be in tools. configure always
# asks, whatever this says. Add "remember" to approve each memory; take out
# "write_file" to let it save without asking.
confirm = ["write_file"]

[web]
# Where SearXNG, the search engine you run on this machine, answers.
# Loopback only. Empty turns web_search off. See "Web search" in
# docs/running.md to start it.
searxng_url = "http://127.0.0.1:8888"
# How many results web_search returns when the model doesn't say, 1 to 20.
max_results = 8

[skills]
# The one folder write_file may write in. web_fetch saves downloads in its
# downloads/ folder.
output_dir = "~/meru-output"
# Skills merud doesn't load. Four ship with Meru, and merud copies them to
# skills/ on first run:
#   writing        plain-English rules for any prose Meru writes
#   explainer      builds a self-contained HTML page that teaches a topic
#   web-research   searches, reads the best pages and cites them
#   file-research  finds things in your files with the file tools and cites them
# A built-in named here isn't copied again. A folder you add to skills/
# loads with no change here. For example: disabled = ["explainer"]
disabled = []

[chat]
# Let a click on a code block's "⧉ copy N" label copy the block. /copy N
# and Ctrl-Y copy with the keyboard either way. With this on, the chat
# takes the mouse, so to select text yourself hold Option while you drag
# (iTerm2) or Shift (most other terminals). false gives plain selection
# back.
mouse_copy = true

# MCP servers: programs that give the model tools. None by default.
# `meru mcp add <name>` writes an entry for you and `meru mcp` shows each
# server's state. See ARCHITECTURE.md, "MCP".
#
# An entry has command (merud starts the server and talks over stdin and
# stdout) or url (a Streamable HTTP server you run; merud connects). The
# model gets only the tools allow names, with no wildcards. A tool in
# confirm asks before each call; one in always_confirm asks every time,
# with no approval for the session. `meru tools` shows what a server offers.
#
# The two servers in Meru's catalog, as `meru mcp add` writes them:
#
# # Gmail, Google Calendar, Drive and Docs: Searches and reads your mail, lists calendar events, searches Drive and reads Docs; sending mail and changing an event ask first. You start and run this server; Meru never does.
# # Docs: https://github.com/taylorwilsdon/google_workspace_mcp
# [[mcp.servers]]
# name    = "google"
# url     = "http://127.0.0.1:8000/mcp"
# allow   = ["search_gmail_messages", "get_gmail_message_content", "get_gmail_thread_content", "send_gmail_message", "get_events", "manage_event", "search_drive_files", "get_doc_content", "get_gmail_attachment_content"]
# confirm = ["send_gmail_message", "manage_event"]
#
# # Obsidian: Lists, searches and reads the notes in your open Obsidian vault; appending to a note asks first.
# # Docs: https://github.com/MarkusPfundstein/mcp-obsidian
# [[mcp.servers]]
# name    = "obsidian"
# command = "uvx"
# args    = ["mcp-obsidian"]
# env     = { OBSIDIAN_API_KEY = "secret:obsidian_api_key", OBSIDIAN_HOST = "127.0.0.1", OBSIDIAN_PORT = "27124" }
# allow   = ["obsidian_list_files_in_vault", "obsidian_list_files_in_dir", "obsidian_get_file_contents", "obsidian_simple_search", "obsidian_append_content"]
# confirm = ["obsidian_append_content"]
#
# A Streamable HTTP server of your own, with every key it takes. env works
# only with command, because merud starts no process for a url; send a key
# in headers instead.
#
# [[mcp.servers]]
# name    = "my-server"                  # tools become "my-server.<tool>"
# url     = "http://127.0.0.1:9200/mcp"
# headers = { Authorization = "secret:my_server_token" }  # sent on every request
# remote  = false                        # true lets merud reach a url on another machine
# allow   = ["search", "delete_item"]
# confirm = []
# always_confirm = ["delete_item"]
# timeout = "60s"                        # longest one call may take; the default
#
# Secrets: API keys and tokens live in secrets.toml next to this file, one
# name = "value" per line, never here. A "secret:<name>" value in env or
# headers reads from it. merud refuses the file unless only you can read
# it (chmod 600), and hides every value from transcripts, logs and traces.
# `meru mcp add` writes it for you:
#
#   obsidian_api_key = "..."

# Local commands: programs the model may run, one tool each, "cmd.<name>".
# None by default. See ARCHITECTURE.md, "Local commands".
#
# The model fills in the {param} placeholders and nothing else: it can't
# add a flag, chain a program or reach a shell. merud runs argv[0] with no
# shell and refuses a shell or interpreter (sh, bash, python, node, env).
# A leading "~" means your home folder; {{ and }} are literal braces.
# Parameter types:
#
#   string  text up to max_len bytes (default 4096); it can't start with
#           "-" when it fills a whole element, so it can't be a flag.
#           pattern, a regular expression, must match the whole value
#   int     a whole number, within min and max when set
#   enum    one of values
#   path    must exist and lie inside under (required), links followed
#
# Other keys: cwd (where the program starts; default your home folder),
# timeout (default "30s", at most "300s"), confirm = true (ask before each
# run) and env_allowlist (variables passed on top of PATH, HOME and LANG).
#
# [[commands]]
# name        = "git-log"
# description = "Recent commits in one of the user's repositories"
# argv        = ["git", "-C", "{repo}", "log", "--oneline", "-n", "20"]
# timeout     = "10s"
#   [commands.params.repo]
#   type  = "path"
#   under = "~/repos"
#
# [[commands]]
# name        = "git-status"
# description = "Files changed but not committed in one of the user's repositories"
# argv        = ["git", "-C", "{repo}", "status", "--short"]
#   [commands.params.repo]
#   type  = "path"
#   under = "~/repos"
#
# [[commands]]
# name        = "search-notes"
# description = "Full-text search across the user's notes"
# argv        = ["rg", "--json", "--", "{pattern}", "~/notes"]
#   [commands.params.pattern]
#   type        = "string"
#   description = "The text or regular expression to find"
#
# [[commands]]
# name        = "disk-free"
# description = "Free space on each mounted disk"
# argv        = ["df", "-h"]
#
# A snapshot of the machine, on macOS. Each program prints once and exits.
# htop, and top without -l, redraw the screen until you quit, so a command
# can't use them. The first sample top takes can't measure CPU use, so
# top-processes takes two a second apart; the second table holds the real
# figures.
#
# [[commands]]
# name        = "system-load"
# description = "Load average, CPU use and memory use for the whole machine, as one snapshot"
# argv        = ["top", "-l", "1", "-n", "0"]
#
# [[commands]]
# name        = "top-processes"
# description = "The 15 processes using the most CPU or memory. Read the second table: the first table's CPU figures are wrong."
# argv        = ["top", "-l", "2", "-s", "1", "-n", "15", "-o", "{sort}", "-stats", "pid,command,cpu,mem,time"]
# timeout     = "10s"
#   [commands.params.sort]
#   type   = "enum"
#   values = ["cpu", "mem"]
#
# [[commands]]
# name        = "find-process"
# description = "Running processes whose command line holds a name, with their process IDs"
# argv        = ["pgrep", "-l", "-f", "{name}"]
#   [commands.params.name]
#   type        = "string"
#   pattern     = "[A-Za-z0-9 ._-]+"
#   description = "Part of the program's name, such as ollama"
#
# [[commands]]
# name        = "memory-free"
# description = "How much of the machine's memory is free, as a percentage"
# argv        = ["memory_pressure", "-Q"]
#
# Facts about the machine, on macOS: the operating system, the hardware,
# the disks and the battery. Each only reads. system_profiler's mini
# detail level leaves out the serial number.
#
# [[commands]]
# name        = "kernel"
# description = "The kernel's name, version and CPU architecture, from uname"
# argv        = ["uname", "-a"]
#
# [[commands]]
# name        = "macos-version"
# description = "The macOS version and build number"
# argv        = ["sw_vers"]
#
# [[commands]]
# name        = "hardware-summary"
# description = "The Mac's model, chip, CPU count, memory in bytes, swap use and when it last started"
# argv        = ["sysctl", "hw.model", "machdep.cpu.brand_string", "hw.ncpu", "hw.memsize", "vm.swapusage", "kern.boottime"]
#
# [[commands]]
# name        = "system-report"
# description = "One section of the Mac's system report"
# argv        = ["system_profiler", "-detailLevel", "mini", "{section}"]
#   [commands.params.section]
#   type        = "enum"
#   values      = ["SPHardwareDataType", "SPDisplaysDataType", "SPStorageDataType", "SPPowerDataType", "SPSoftwareDataType", "SPMemoryDataType"]
#   description = "Hardware for the chip, cores and memory; Displays for the GPU and screens; Storage for volumes and free space; Power for the battery and charger; Software for the OS, computer name and user; Memory for the memory chips"
#
# [[commands]]
# name        = "battery"
# description = "Whether the Mac runs on battery or mains power, and the charge left"
# argv        = ["pmset", "-g", "batt"]
#
# [[commands]]
# name        = "disk-list"
# description = "Every disk, partition and APFS volume, with sizes"
# argv        = ["diskutil", "list"]
#
# [[commands]]
# name        = "uptime"
# description = "How long the machine has run since it started, and its load average"
# argv        = ["uptime"]
#
# sed and awk, with the script written here. The model picks numbers and a
# file and never writes script text: a pattern of its own could close the
# sed address and add a w command that writes a file, or call system() in
# awk. perl stays out, since merud refuses it. These commands read secret
# files that read_file skips, so point under at a folder that holds none.
#
# [[commands]]
# name        = "file-lines"
# description = "Lines start to end of a text file, counting from 1"
# argv        = ["sed", "-n", "{start},{end}p", "{file}"]
#   [commands.params.file]
#   type  = "path"
#   under = "~/Documents"
#   [commands.params.start]
#   type = "int"
#   min  = 1
#   [commands.params.end]
#   type = "int"
#   min  = 1
#
# [[commands]]
# name        = "count-lines"
# description = "How many lines a text file holds"
# argv        = ["awk", "END {{print NR}}", "{file}"]
#   [commands.params.file]
#   type  = "path"
#   under = "~/Documents"
#
# [[commands]]
# name        = "csv-column"
# description = "One column of a comma-separated file, one value per line, header first"
# argv        = ["awk", "-F", ",", "{{print ${column}}}", "{file}"]
#   [commands.params.file]
#   type  = "path"
#   under = "~/Documents"
#   [commands.params.column]
#   type = "int"
#   min  = 1
#   max  = 1000
#
# [[commands]]
# name        = "csv-sum"
# description = "The total of one number column in a comma-separated file whose first line is a header"
# argv        = ["awk", "-F", ",", "NR > 1 {{sum += ${column}}} END {{print sum}}", "{file}"]
#   [commands.params.file]
#   type  = "path"
#   under = "~/Documents"
#   [commands.params.column]
#   type = "int"
#   min  = 1
#   max  = 1000
#
# GitHub with the gh CLI. Install gh and run `gh auth login` once: gh
# keeps its token in your keychain, so Meru never sees it. These commands
# only read. Uncomment the ones you want and restart merud. If merud can't
# find gh on its PATH, give argv[0] the full path `command -v gh` prints.
# docs/running.md, "GitHub", shows how to add a command that writes.
#
# [[commands]]
# name        = "gh-prs"
# description = "Pull requests in a GitHub repository, newest first, as JSON"
# argv        = ["gh", "pr", "list", "--repo", "{repo}", "--state", "{state}", "--limit", "20", "--json", "number,title,author,state,updatedAt,url"]
#   [commands.params.repo]
#   type        = "string"
#   pattern     = "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
#   description = "The repository as owner/name, such as dana-reyes/garden-planner"
#   [commands.params.state]
#   type   = "enum"
#   values = ["open", "closed", "merged", "all"]
#
# [[commands]]
# name        = "gh-pr"
# description = "One pull request in a GitHub repository, with its text, reviews and comments, as JSON"
# argv        = ["gh", "pr", "view", "{number}", "--repo", "{repo}", "--json", "number,title,body,state,author,reviews,comments,url"]
#   [commands.params.repo]
#   type        = "string"
#   pattern     = "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
#   description = "The repository as owner/name, such as dana-reyes/garden-planner"
#   [commands.params.number]
#   type = "int"
#   min  = 1
#
# [[commands]]
# name        = "gh-issues"
# description = "Issues in a GitHub repository, newest first, as JSON"
# argv        = ["gh", "issue", "list", "--repo", "{repo}", "--state", "{state}", "--limit", "20", "--json", "number,title,labels,state,updatedAt,url"]
#   [commands.params.repo]
#   type        = "string"
#   pattern     = "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
#   description = "The repository as owner/name, such as dana-reyes/garden-planner"
#   [commands.params.state]
#   type   = "enum"
#   values = ["open", "closed", "all"]
#
# [[commands]]
# name        = "gh-issue"
# description = "One issue in a GitHub repository, with its text and comments, as JSON"
# argv        = ["gh", "issue", "view", "{number}", "--repo", "{repo}", "--json", "number,title,body,state,comments,url"]
#   [commands.params.repo]
#   type        = "string"
#   pattern     = "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
#   description = "The repository as owner/name, such as dana-reyes/garden-planner"
#   [commands.params.number]
#   type = "int"
#   min  = 1
#
# [[commands]]
# name        = "gh-runs"
# description = "The latest GitHub Actions runs in a repository and how each ended, as JSON"
# argv        = ["gh", "run", "list", "--repo", "{repo}", "--limit", "10", "--json", "databaseId,displayTitle,status,conclusion,workflowName,createdAt,url"]
#   [commands.params.repo]
#   type        = "string"
#   pattern     = "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
#   description = "The repository as owner/name, such as dana-reyes/garden-planner"
#
# [[commands]]
# name        = "gh-repos"
# description = "The repositories of a GitHub user or organization, as JSON"
# argv        = ["gh", "repo", "list", "{owner}", "--limit", "30", "--json", "name,description,visibility,updatedAt,url"]
#   [commands.params.owner]
#   type        = "string"
#   pattern     = "[A-Za-z0-9-]+"
#   description = "The user or organization, such as dana-reyes"

# Other agents Meru may hand a task to over A2A (Agent2Agent). None by
# default. Each allowed skill, by the ID on the agent's card, becomes the
# tool "a2a.<name>.<skill>". url must be loopback unless remote = true.
# See ARCHITECTURE.md, "Other agents (A2A)".
#
# [[a2a.agents]]
# name    = "research"
# url     = "http://127.0.0.1:9000"  # where merud reads the agent card
# remote  = false
# headers = { Authorization = "secret:research_token" }
# allow   = ["summarize"]
# confirm = []
# timeout = "60s"
