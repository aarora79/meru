<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meru</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Chats">
      <div class="brand">
        <button type="button" class="brand-link" id="open-about" aria-label="About Meru" aria-describedby="tagline"
          title="A personal AI assistant that runs entirely on your own computer">
          <img class="brand-logo" src="img/meru-logo.svg" alt="" width="30" height="30">
          <span class="brand-text">
            <span class="wordmark">Meru</span>
            <span class="brand-version" id="brand-version"></span>
          </span>
        </button>
        <span class="visually-hidden" id="tagline">A personal AI assistant that runs entirely on your own computer</span>
        <button type="button" class="icon-button rail-toggle" id="rail-toggle" aria-label="Collapse the sidebar" aria-expanded="true"></button>
      </div>
      <button type="button" class="button new-chat" id="new-chat">New chat</button>
      <div class="search">
        <label for="search" class="visually-hidden">Search chats</label>
        <span class="search-icon" id="search-icon"></span>
        <input id="search" type="search" placeholder="Search chats" autocomplete="off" spellcheck="false">
      </div>
      <div class="sessions" id="sessions"></div>
      <section class="status" id="status" aria-label="merud status" aria-live="polite"></section>
      <div class="rail-foot">
        <button type="button" class="rail-link" id="open-settings">Settings</button>
        <button type="button" class="rail-link" id="open-setup">Setup</button>
      </div>
    </nav>

    <nav class="mini-rail" id="mini-rail" aria-label="Meru" hidden>
      <img class="brand-logo" src="img/meru-logo.svg" alt="Meru" width="30" height="30"
        title="A personal AI assistant that runs entirely on your own computer">
      <button type="button" class="icon-button" id="mini-expand" aria-label="Show the sidebar"></button>
      <button type="button" class="icon-button" id="mini-new" aria-label="New chat"></button>
      <button type="button" class="icon-button" id="mini-chats" aria-label="Chats"></button>
      <button type="button" class="icon-button" id="mini-settings" aria-label="Settings"></button>
      <span class="mini-status" id="mini-status" role="img" aria-label="merud status"></span>
    </nav>

    <main class="chat" id="chat-view" data-file-drop-target>
      <header class="chat-head">
        <h1 id="chat-title">New chat</h1>
        <div class="head-actions">
          <button type="button" class="text-button" id="share" hidden>Share as file</button>
          <button type="button" class="icon-button" id="toggle-panel" aria-controls="panel" aria-expanded="true" aria-label="Hide the side panel"></button>
        </div>
      </header>
      <div class="messages" id="messages"></div>
      <div class="drop-overlay" aria-hidden="true">
        <p class="drop-title">Drop to attach</p>
        <p class="drop-note">Meru keeps a copy in its output folder, and reads only the files and images you drop.</p>
      </div>
      <div class="composer-area">
        <div class="task-slot" id="task-slot"></div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <ol class="queue" id="queue" aria-label="Queued questions" hidden></ol>
        <ul class="command-menu" id="command-menu" role="listbox" aria-label="Commands" hidden></ul>
        <form class="composer" id="composer">
          <div class="attachments" id="attachments" hidden></div>
          <label for="question" class="visually-hidden">Ask Meru</label>
          <textarea id="question" rows="1" placeholder="Ask about your files, mail, notes or the web · / for commands"
            role="combobox" aria-autocomplete="list" aria-controls="command-menu" aria-expanded="false"></textarea>
          <div class="composer-bar">
            <div class="scope" id="scope" role="radiogroup" aria-label="Where Meru looks"></div>
            <button type="button" class="icon-button" id="attach" aria-label="Attach files or images" title="Attach files or images, or drop them on the chat"></button>
            <span class="hint">Enter sends · Shift+Enter adds a line</span>
            <button type="button" class="button secondary" id="stop" hidden>Stop</button>
            <button type="submit" class="button primary" id="send">Send</button>
          </div>
        </form>
      </div>
    </main>

    <main class="page" id="settings-view" hidden aria-labelledby="settings-title"></main>
    <main class="page" id="setup-view" hidden aria-labelledby="setup-title"></main>

    <aside class="panel" id="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title">What this answer used</h2>
        <button type="button" class="icon-button close-panel" id="close-panel" aria-label="Close"></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>
</body>
</html>
